name: Release Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # descriptor.mod 파일에서 version 속성 추출 (기본값: 1.0)
            BASE_VERSION=$(grep -E 'version="[^"]+"' descriptor.mod | sed -E 's/.*version="([^"]+)".*/\1/' || echo "1.0")
            TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "🏷️ Target Tag: ${TAG_NAME}"

      - name: Package Mod Files
        run: |
          # 불필요한 파일(.git, .github, scripts 등)을 제외하고 모드 파일 패키징
          zip -r ck3-nanumsquare-neo.zip \
            descriptor.mod \
            thumbnail.png \
            fonts/ \
            gui/ \
            localization/ \
            -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Release ${{ steps.vars.outputs.tag_name }}"
          files: |
            ck3-nanumsquare-neo.zip
            descriptor.mod
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
