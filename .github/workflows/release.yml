name: Release Mod

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # descriptor.mod의 첫 줄 version만 정확히 추출 (supported_version 제외)
            BASE_VERSION=$(grep -m 1 -E '^version="[^"]+"' descriptor.mod | sed -E 's/^version="([^"]+)".*/\1/')
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="1.0.0"
            fi

            # 동일 태그 중복 방지
            if git rev-parse "v${BASE_VERSION}" >/dev/null 2>&1; then
              TAG_NAME="v${BASE_VERSION}.${{ github.run_number }}"
            else
              TAG_NAME="v${BASE_VERSION}"
            fi
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "🏷️ Target Tag: ${TAG_NAME}"

      - name: Package Mod Files
        run: |
          # 불필요한 파일(.git, .github, scripts 등)을 제외하고 모드 파일 패키징
          zip -r ck3-nanumsquare-neo.zip \
            descriptor.mod \
            thumbnail.png \
            fonts/ \
            gui/ \
            localization/ \
            -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Release ${{ steps.vars.outputs.tag_name }}"
          files: |
            ck3-nanumsquare-neo.zip
            descriptor.mod
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
